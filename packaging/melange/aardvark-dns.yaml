---
# aardvark-dns — the authoritative DNS server netavark starts for container
# name resolution on user-defined networks. Pure Rust, no C dependencies.
package:
  name: aardvark-dns
  # PLACEHOLDER, deliberately not a real version.
  #
  # Set at build time by build-podman-packages.yaml, in the step "Pin the
  # definition to the requested version and commit": it copies this file into
  # .melange-build/ and rewrites .package.version from the components JSON that
  # upstream-watch (or a manual release dispatch) resolved. The committed file is
  # never the one that gets built.
  #
  # Nothing reads the value here. components/restore deletes .package.version
  # outright before hashing the recipe for the component cache key, precisely
  # because it is not part of the recipe.
  #
  # This used to carry the last-released version, which was worse than useless:
  # it looked authoritative, was never consulted, and silently drifted from
  # whatever was actually being built. If the token survives into a build,
  # `tag: v${{package.version}}` below resolves to "v@VERSION@" and the checkout
  # fails -- which is the entire point of it being a token.
  version: "@VERSION@"
  epoch: 0
  description: Container-aware DNS server for netavark (static musl build)
  url: https://github.com/containers/aardvark-dns
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-524d27bb.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-58199dcc.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616a9724.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616adfeb.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
    packages:
      - build-base
      - busybox
      - cargo
      - git
      - make
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/aardvark-dns
      tag: v${{package.version}}
      # PLACEHOLDER, deliberately not a real commit.
      #
      # Set from the components JSON by the same step that sets the version
      # above, and likewise deleted by components/restore before the recipe is
      # hashed.
      #
      # melange validates this field's SHAPE at compile time -- "contains invalid
      # characters or invalid sha length" -- so the @TOKEN@ convention used for
      # the version is not available here. Forty hex characters spelling
      # "deadbeef" is the closest thing to an obviously-fake SHA that still
      # parses, and `melange compile` in ci.yaml needs it to parse.
      #
      # If it survives into a build, git-checkout aborts with
      # "Expected commit deadbeefdeadbeef... for <tag>, found <real sha>".
      expected-commit: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - name: Build
    runs: |
      # See netavark.yaml for why --target is required rather than setting
      # RUSTFLAGS globally: proc-macro crates must stay dynamic host artifacts.
      host_triple="$(rustc -vV | sed -n 's/^host: //p')"
      echo "host triple: ${host_triple}"

      export CARGO_TARGET_DIR=targets
      export RUSTFLAGS='-C target-feature=+crt-static'

      cargo build --release --target "${host_triple}"

      install -Dm755 "targets/${host_triple}/release/aardvark-dns" bin/aardvark-dns

  - name: Strip
    runs: |
      # See netavark.yaml and docs/build-model.md: symbols and DWARF are 30% of
      # the shipped payload. The dynamic section survives, so the assertion below
      # is unaffected.
      strip --strip-unneeded bin/aardvark-dns

  - name: Assert the binary is statically linked
    runs: |
      if readelf -d bin/aardvark-dns 2> /dev/null | grep -q 'NEEDED'; then
        echo "FAIL: bin/aardvark-dns is dynamically linked" >&2
        readelf -d bin/aardvark-dns >&2
        exit 1
      fi
      echo "OK (static): bin/aardvark-dns"

  - name: Install
    runs: |
      make \
        DESTDIR="${{targets.destdir}}" \
        PREFIX=/usr \
        install
