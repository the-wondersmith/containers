---
# buildah — the standalone CLI. podman already links buildah as a Go library;
# this ships the separate /usr/bin/buildah command as part of the bundle.
#
# Same header-probe strategy as podman.yaml: buildah computes its tag set from
# ./btrfs_installed_tag.sh, ./hack/libsubid_tag.sh, ./hack/systemd_tag.sh and
# ./hack/sqlite_tag.sh, so the installed -dev packages are the configuration.
# Note the extension variable is EXTRA_BUILD_TAGS here, with an underscore --
# podman spells the same concept EXTRA_BUILDTAGS.
#
# buildah sets `PREFIX := /usr/local` with a simple assignment, so it cannot be
# overridden from the environment; it must be passed on the make command line,
# which takes precedence over everything in the makefile.
package:
  name: buildah
  # PLACEHOLDER, deliberately not a real version.
  #
  # Set at build time by build-podman-packages.yaml, in the step "Pin the
  # definition to the requested version and commit": it copies this file into
  # .melange-build/ and rewrites .package.version from the components JSON that
  # upstream-watch (or a manual release dispatch) resolved. The committed file is
  # never the one that gets built.
  #
  # Nothing reads the value here. components/restore deletes .package.version
  # outright before hashing the recipe for the component cache key, precisely
  # because it is not part of the recipe.
  #
  # This used to carry the last-released version, which was worse than useless:
  # it looked authoritative, was never consulted, and silently drifted from
  # whatever was actually being built. If the token survives into a build,
  # `tag: v${{package.version}}` below resolves to "v@VERSION@" and the checkout
  # fails -- which is the entire point of it being a token.
  version: "@VERSION@"
  epoch: 0
  description: Tool for building OCI container images (static musl build)
  url: https://buildah.io
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-524d27bb.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-58199dcc.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616a9724.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616adfeb.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
    packages:
      - bash
      - build-base
      - busybox
      - git
      - go
      - go-md2man
      - libseccomp-dev
      - libseccomp-static
      - linux-headers
      - make

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/buildah
      tag: v${{package.version}}
      # PLACEHOLDER, deliberately not a real commit.
      #
      # Set from the components JSON by the same step that sets the version
      # above, and likewise deleted by components/restore before the recipe is
      # hashed.
      #
      # melange validates this field's SHAPE at compile time -- "contains invalid
      # characters or invalid sha length" -- so the @TOKEN@ convention used for
      # the version is not available here. Forty hex characters spelling
      # "deadbeef" is the closest thing to an obviously-fake SHA that still
      # parses, and `melange compile` in ci.yaml needs it to parse.
      #
      # If it survives into a build, git-checkout aborts with
      # "Expected commit deadbeefdeadbeef... for <tag>, found <real sha>".
      expected-commit: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - name: Report the probed build tags
    runs: |
      echo "apparmor:  $(hack/apparmor_tag.sh)"
      echo "btrfs:     $(./btrfs_installed_tag.sh)"
      echo "libsubid:  $(./hack/libsubid_tag.sh)"
      echo "sqlite:    $(./hack/sqlite_tag.sh)"
      echo "systemd:   $(./hack/systemd_tag.sh)"

  - name: Build
    runs: |
      export GOFLAGS='-trimpath -ldflags=-extldflags=-static'

      make bin/buildah \
        PREFIX=/usr \
        EXTRA_BUILD_TAGS='containers_image_openpgp osusergo netgo' \
        EXTRA_LDFLAGS='-extldflags=-static'

      # docs/Makefile's install target copies buildah*.1 but does not depend on
      # the rule that generates them, so they must be built explicitly first.
      # GOMD2MAN defaults to a copy built out of tests/tools; point it at the
      # go-md2man already installed in the build environment instead.
      make -C docs GOMD2MAN=go-md2man

  - name: Strip
    runs: |
      # buildah is the second-largest binary in the payload and loses 31% to
      # stripping -- 50.2 MB to 34.2 MB. See docs/build-model.md.
      #
      # Go tolerates this: strip removes DWARF and the symbol table but not the
      # pclntab, so panic tracebacks stay symbolised, and not the dynamic
      # section, so the assertion below still means what it says.
      strip --strip-unneeded bin/buildah

  - name: Assert the binary is statically linked
    runs: |
      if readelf -d bin/buildah 2> /dev/null | grep -q 'NEEDED'; then
        echo "FAIL: bin/buildah is dynamically linked" >&2
        readelf -d bin/buildah >&2
        exit 1
      fi
      echo "OK (static): bin/buildah"

  - name: Install
    runs: |
      make \
        DESTDIR="${{targets.destdir}}" \
        PREFIX=/usr \
        EXTRA_BUILD_TAGS='containers_image_openpgp osusergo netgo' \
        EXTRA_LDFLAGS='-extldflags=-static' \
        install install.completions
