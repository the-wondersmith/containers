---
# netavark — podman's network stack. Rust, nftables-only since 2.x (all
# iptables and CNI code was removed upstream).
#
# protoc is a hard build requirement: netavark's build.rs drives tonic/prost
# code generation for the DHCP proxy gRPC interface.
#
# install.systemd IS run, and the units matter more than they look:
#
#   netavark-nftables-reload.service  Type=oneshot, PartOf=/WantedBy=
#       nftables.service. Runs `netavark firewall-reload` once. nftables is a
#       hard dependency of this package, and reloading it flushes netavark's
#       rules -- without this unit container networking breaks silently until
#       something re-adds them.
#   netavark-firewalld-reload.service Type=simple, WantedBy= firewalld.service.
#       Despite the symmetric name, a different shape: it runs `netavark
#       firewalld-reload`, a long-running zbus listener on firewalld's
#       org.fedoraproject.FirewallD1 "Reloaded" signal.
#   netavark-dhcp-proxy.{socket,service}
#       The DHCP proxy, for macvlan/ipvlan networks that take addresses from a
#       real LAN DHCP server (--ipam-driver=dhcp). Shipped ENABLED: debian/rules
#       enables and starts both, and the bundle's post-install scriptlet adds
#       the OpenRC equivalent to the default runlevel.
#
# Alpine has no systemd, so podman-bundle.yaml strips usr/lib/systemd from the
# payload rather than this component omitting it -- the component is shared
# byte-for-byte with the Debian package, and Debian needs the units.
package:
  name: netavark
  # PLACEHOLDER, deliberately not a real version.
  #
  # Set at build time by build-podman-packages.yaml, in the step "Pin the
  # definition to the requested version and commit": it copies this file into
  # .melange-build/ and rewrites .package.version from the components JSON that
  # upstream-watch (or a manual release dispatch) resolved. The committed file is
  # never the one that gets built.
  #
  # Nothing reads the value here. components/restore deletes .package.version
  # outright before hashing the recipe for the component cache key, precisely
  # because it is not part of the recipe.
  #
  # This used to carry the last-released version, which was worse than useless:
  # it looked authoritative, was never consulted, and silently drifted from
  # whatever was actually being built. If the token survives into a build,
  # `tag: v${{package.version}}` below resolves to "v@VERSION@" and the checkout
  # fails -- which is the entire point of it being a token.
  version: "@VERSION@"
  epoch: 0
  description: Container network stack for podman (static musl build)
  url: https://github.com/containers/netavark
  copyright:
    - license: Apache-2.0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-524d27bb.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-58199dcc.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616a9724.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616adfeb.rsa.pub
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
    packages:
      - build-base
      - busybox
      - cargo
      - git
      - go-md2man
      - make
      - protobuf-dev
      - protoc
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/netavark
      tag: v${{package.version}}
      # PLACEHOLDER, deliberately not a real commit.
      #
      # Set from the components JSON by the same step that sets the version
      # above, and likewise deleted by components/restore before the recipe is
      # hashed.
      #
      # melange validates this field's SHAPE at compile time -- "contains invalid
      # characters or invalid sha length" -- so the @TOKEN@ convention used for
      # the version is not available here. Forty hex characters spelling
      # "deadbeef" is the closest thing to an obviously-fake SHA that still
      # parses, and `melange compile` in ci.yaml needs it to parse.
      #
      # If it survives into a build, git-checkout aborts with
      # "Expected commit deadbeefdeadbeef... for <tag>, found <real sha>".
      expected-commit: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef

  - name: Build
    runs: |
      # Alpine patches rustc to link musl dynamically by default; +crt-static
      # restores upstream musl-target behaviour. That matters because this same
      # binary is bundled into the .deb, where musl is not present.
      #
      # RUSTFLAGS must be scoped with an explicit --target. Applied globally it
      # also hits proc-macro crates, which have to be dynamic host artifacts,
      # and the build dies with "cannot produce proc-macro for <crate> as the
      # target <triple> does not support these crate types". Naming the host
      # triple as the target keeps host and target units distinct.
      #
      # Building via cargo rather than `make build` because --target adds a
      # triple component to the output path that the Makefile's copy does not
      # expect; the binary is placed at bin/netavark itself, which is what
      # install.netavark consumes.
      host_triple="$(rustc -vV | sed -n 's/^host: //p')"
      echo "host triple: ${host_triple}"

      export CARGO_TARGET_DIR=targets
      export RUSTFLAGS='-C target-feature=+crt-static'

      cargo build --release --target "${host_triple}"

      install -Dm755 "targets/${host_triple}/release/netavark" bin/netavark

      make docs

  - name: Strip
    runs: |
      # Measured on the shipped .deb: DWARF and symbol tables are 30% of the
      # payload -- 142 MB of binaries becomes 99 MB. netavark alone drops 22%.
      # See docs/build-model.md; `debian/rules` previously asserted stripping
      # "buys very little", which was wrong by an order of magnitude.
      #
      # Safe for a static binary: strip removes DWARF and the symbol table but
      # leaves the dynamic section, so the linkage assertion below still means
      # what it says.
      strip --strip-unneeded bin/netavark

  - name: Assert the binary is statically linked
    runs: |
      if readelf -d bin/netavark 2> /dev/null | grep -q 'NEEDED'; then
        echo "FAIL: bin/netavark is dynamically linked" >&2
        readelf -d bin/netavark >&2
        exit 1
      fi
      echo "OK (static): bin/netavark"

  - name: Install
    runs: |
      make \
        DESTDIR="${{targets.destdir}}" \
        PREFIX=/usr \
        install.netavark install.docs install.systemd
