# ifupdown2-pre.service runs ExecStart=/bin/udevadm settle, which waits for the
# udev event queue to drain.  A container runs no udev daemon, so the queue is
# never serviced and the call blocks until the unit's TimeoutSec=180 expires.
# The unit is ordered Before=network.target with DefaultDependencies=no, so
# everything waiting on the network stalls for three minutes at every start.
#
# Replacing ExecStart with /bin/true satisfies the ordering without the wait.
# The bare ExecStart= is a reset that clears the inherited value; without it,
# systemd appends and both commands run.
#
# This unit's existence depends on which ifupdown2 is installed, which is worth
# recording because an earlier revision of this package asserted the opposite.
# Debian's ifupdown2 3.0.0-1.3 ships only ifup@.service and networking.service.
# Proxmox's 3.3.0-1+pmx12 -- which this image now builds from source and
# installs on both architectures -- also ships ifupdown2-pre.service.  A drop-in
# for a unit that does not exist is silently inert, so this file was harmless
# when it was wrong and is load-bearing now that it is right.
[Service]
ExecStart=
ExecStart=/bin/true
