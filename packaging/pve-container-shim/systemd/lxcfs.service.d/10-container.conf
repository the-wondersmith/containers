# lxcfs.service ships ConditionVirtualization=!container in its [Unit] section.
# Under Docker or Podman, systemd-detect-virt reports the virtualisation
# identifier as docker or podman, both of which satisfy the !container negation,
# so the condition evaluates to false and lxcfs is skipped entirely rather than
# started. Clearing the condition with an empty assignment removes the guard and
# allows the unit to start in any virtualisation context.
#
# The ExecStartPre line unmounts any stale lxcfs mountpoint left by an unclean
# stop. Without it, a container that is stopped and restarted without the lxcfs
# daemon unmounting cleanly yields "Transport endpoint is not connected" from
# fusermount3 when the next start attempts to mount over an already-occupied
# path. The leading - makes the failure non-fatal: when there is nothing mounted
# the unmount exits non-zero, which is expected and must not abort the unit.
[Unit]
ConditionVirtualization=

[Service]
ExecStartPre=-/bin/fusermount3 -u /var/lib/lxcfs
