# networking.service is WantedBy=basic.target network.target shutdown.target and
# carries no ConditionVirtualization guard, so it runs unconditionally in every
# boot context. Its ExecStart invokes ifup -a, which brings up every stanza
# marked auto in /etc/network/interfaces. In a container that includes the
# uplink the container runtime created and owns, described by a file the runtime
# never wrote, so reconfiguring it ranges from a no-op to disconnecting the
# container.
#
# An earlier revision replaced ExecStart with /bin/true. That was correct while
# the image had no guest networking: there was nothing in the file worth
# applying, so applying nothing was honest. It stopped being correct once the
# image began declaring a guest bridge, because a bridge with no member port is
# entirely internal -- it exists only to give guests somewhere to attach -- and
# bringing one up touches no interface the runtime cares about.
#
# ifup-guest-bridges applies exactly that subset: stanzas that are marked auto
# AND carry a bridge-ports line. Everything else in the file is left alone. That
# makes /etc/network/interfaces the real source of truth for the part of the
# network this image owns, rather than a file PVE writes and nothing reads.
#
# The first ExecStart= assignment is a reset that clears the inherited value;
# without it, systemd appends and ifup -a runs as well.
[Service]
ExecStart=
ExecStart=/usr/libexec/pve-container-shim/ifup-guest-bridges
