# /run/network is where ifupdown2 creates its lock file.  Without the
# directory, ifup and ifreload fail with:
#
#   error: Another instance of this program is already running.
#
# which is emitted when the lock file cannot be CREATED, not only when one is
# genuinely held.  A missing parent directory therefore reports as a
# concurrency conflict, naming neither the directory nor the path, and no
# amount of checking for stray processes finds anything -- confirmed by
# experiment, where two ifup attempts failed with that message while ps showed
# no ifupdown2 process at all, and creating this one directory fixed it.
#
# Debian's ifupdown2 normally gets this directory from networking.service's own
# start-up sequence.  This image replaces that unit's ExecStart, so the
# directory is never created and the first network operation of the container's
# life fails for a reason that points somewhere else entirely.
#
# tmpfiles.d rather than the entrypoint because systemd-tmpfiles-setup.service
# runs before any network unit, the entry is enumerable with dpkg -L, and it
# still applies if a network unit is restarted later in the container's life --
# none of which is true of a one-shot mkdir at start-up.
d /run/network 0755 root root -

# Ownership and mode for the two persistent volumes and for pveproxy's log
# directory.
#
# /var/lib/vz and /var/lib/pve-cluster are declared VOLUMEs, and the runtime's
# documentation tells operators to bind-mount host directories over them.  A
# bind mount arrives with whatever ownership the host directory had, replacing
# what the package set at install time -- so a directory the image got right
# during build can be wrong by the time anything reads it, and nothing in the
# build can prevent that.  These entries reassert it on every start, after the
# mounts are in place.
#
# /var/log/pveproxy is the one that fails loudly: pveproxy drops privileges to
# www-data and opens its access log there.  Root-owned, it cannot, and the unit
# fails with an errno rather than an explanation.
d /var/lib/vz 0755 root root -
d /var/lib/pve-cluster 0755 root root -
d /var/log/pveproxy 0750 www-data www-data -

# Remove PID files left behind by an unclean stop.
#
# When /run is a tmpfs -- which the documented invocation provides -- this is
# already handled, because the whole directory is empty at start.  It is here
# for the operator who omits that flag: a stale PID file from a SIGKILLed
# container makes the next start of that service fail its own liveness check,
# and the failure names a process ID that belongs to nothing.
#
# Enumerated rather than clearing the directories wholesale, because those
# directories also hold sockets and state that a running service is entitled
# to find.
r! /run/pveproxy/pveproxy.pid
r! /run/pvedaemon.pid
r! /run/pvestatd.pid
r! /run/pve-cluster/pve-cluster.pid
r! /run/pve-firewall.pid
r! /run/spiceproxy.pid
r! /run/pvescheduler.pid
