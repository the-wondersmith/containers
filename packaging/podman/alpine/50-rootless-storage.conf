# Restore podman's rootless storage defaults on Alpine.
#
# Alpine's containers-common ships ACTIVE graphroot and runroot values in
# /etc/containers/storage.conf. In podman 6 an explicit value wins even for a
# rootless user -- rootless_storage_path is deprecated and ignored when both are
# set:
#
#   "Both rootless_storage_path and graphroot are set, using graphroot setting
#    only, rootless_storage_path is deprecated and should be removed"
#
# so a rootless user tries to write under /var/lib/containers (graphroot) and
# /run/containers (runroot) and is denied both:
#
#   Error: configure storage: mkdir /run/containers: permission denied
#
# Setting these to the empty string in a drop-in is treated as UNSET rather than
# as a literal empty path, which restores the per-user defaults
# ($HOME/.local/share/containers/storage and the runtime dir under
# XDG_RUNTIME_DIR). Root is unaffected, because the values Alpine sets are
# containers-storage's own built-in defaults for root and resolve identically.
#
# Verified: with this file present, rootless `podman info` reports
# $HOME/.local/share/containers/storage and rootless `podman run` succeeds, while
# rootful still reports /var/lib/containers/storage.
#
# Debian deliberately does NOT get this file. Its
# golang-github-containers-common sets neither key, so the drop-in would be a
# no-op there and would silently override any future Debian default.
[storage]
graphroot = ""
runroot = ""
