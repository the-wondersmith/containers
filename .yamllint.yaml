---
extends: default

yaml-files:
  - "*.yml"
  - "*.yaml"

# Only lint repo-authored YAML; never descend into dependencies or build output.
# Only repo-authored YAML. Everything below is build output, throwaway scratch,
# or upstream source the build actions check out -- linting it reports on code we
# neither wrote nor ship.
ignore: |
  dist/
  packages/
  .local/
  node_modules/
  .act/
  .act-logs/
  .melange-src/
  .melange-build/
  .melange-workspace/
  src/
  # Third-party reference material kept only for behavioural comparison. It is
  # gitignored, never built, and written to a different house style; linting it
  # reports on someone else's choices. lint:shell and lint:containerfile prune
  # it for the same reason.
  dockurr/

rules:
  # GitHub Actions workflows use `on:` as a mapping key, which yamllint would
  # otherwise flag as a truthy value. Skip key checks; still check values.
  truthy:
    check-keys: false

  # Align with editorconfig
  line-length:
    max: 130
    level: warning

  # Sequences are written in block style (`-` per item), never inline flow
  # style. Block style diffs one item per line, so adding a matrix arch or a
  # `needs:` entry shows up as a single added line rather than a rewrite of the
  # whole sequence -- which matters most for the two places this repo uses
  # sequences heavily, matrix dimensions and job dependencies.
  #
  # `non-empty` rather than `true`: an empty sequence has no block
  # representation at all, so `[]` is the only way to write one (see
  # .github/actionlint.yaml's `self-hosted-runner.labels`).
  brackets:
    forbid: non-empty
