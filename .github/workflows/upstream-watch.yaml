---
name: Upstream Watch

# The only thing that starts a release.
#
# Runs weekly, resolves the newest stable semver RELEASE for every component, and
# diffs the result against the manifest.json attached to this repository's most
# recent release. That manifest is the repository's entire persistent state --
# there is no versions.yaml, no bump commit, and no bump pull request.
#
# Every upstream lookup goes through `gh api`. Nothing here shells out to git:
# the only operation that ever needed it -- peeling an annotated tag to the
# commit it points at -- has a one-call REST equivalent. See `tag_commit` below.
#
# Classification decides the lane, not a human:
#   * any component crossing a MAJOR version  -> prerelease, no APT dispatch,
#     promoted only after the soak window in promote-prerelease.yaml;
#   * anything else                           -> straight to a full release.
#
# Nothing is gated on approval. The acceptance suite in test-podman-packages.yaml
# is what stands between an upstream tag and a published package, which is why
# it tests behaviour (container-to-container DNS through netavark and
# aardvark-dns) rather than file placement.

on:
  schedule:
    # Weekly, Monday 08:00 UTC. Deliberately not daily: every run that finds a
    # change spends real build minutes across four package/arch combinations,
    # and upstream does not move fast enough for daily checks to buy anything.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  detect:
    name: Resolve upstream versions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      major: ${{ steps.resolve.outputs.major }}
      components: ${{ steps.resolve.outputs.components }}
      summary: ${{ steps.resolve.outputs.summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Nothing here pushes with git; do not leave the token on disk.
          persist-credentials: false

      - name: Authorize the triggering actor
        uses: ./.github/actions/authorize-actor
        with:
          allow-dependabot: "false"

      - name: Provision the tool set
        uses: ./.github/actions/prepare-ci-env

      - name: Resolve and classify
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # component -> upstream repository, in the OWNER/NAME form `gh api`
          # takes. catatonit is the odd one out: it lives under openSUSE, not
          # containers.
          declare -A repos=(
            [podman]=containers/podman
            [netavark]=containers/netavark
            [aardvark-dns]=containers/aardvark-dns
            [buildah]=containers/buildah
            [catatonit]=openSUSE/catatonit
          )

          # Components eligible for the head fallback. podman is deliberately
          # ABSENT: it is the bulk of the attack surface and the thing users
          # actually run, so it builds from a release tag or it does not build.
          # The four helpers are small, and a snapshot of one of them is a far
          # narrower thing to ship than a snapshot of the engine.
          #
          # A component missing from this set gets no `head` entry in the
          # components JSON, and the build treats that as "tag or nothing".
          declare -A head_eligible=(
            [netavark]=1
            [aardvark-dns]=1
            [buildah]=1
            [catatonit]=1
          )

          # Newest stable x.y.z RELEASE. Note "release", not "tag": this reads
          # /releases rather than the tag namespace, so an upstream tag that was
          # pushed WITHOUT a corresponding GitHub release is invisible here. That
          # is deliberate -- a bare tag is not a thing upstream has announced as
          # shippable, and this workflow's output goes straight to a build with
          # no human in the loop. All five components publish releases for every
          # version worth building.
          #
          # Three filters, and each excludes something the previous tag-based
          # scan could not:
          #
          #   .draft == false        a draft release is not public yet
          #   .prerelease == false   an rc flagged in the API rather than in its
          #                          NAME was previously indistinguishable from a
          #                          stable one, because the tag text is all the
          #                          old scan had to go on
          #   test(...)              plain three-part version, so -rc1/-beta and
          #                          date tags stay out
          #
          # max_by over a NUMERIC key, not `max`: lexically "v1.9.0" sorts above
          # "v1.45.0", which is the bug `sort -V` existed to avoid.
          #
          # `// empty` because max_by returns null on an empty array, and a bare
          # "null" reaching the caller would read as a resolved version. Empty
          # trips the guard below instead.
          latest_tag() {
            gh api "repos/${1}/releases?per_page=100" --jq '
              map(
                select(.draft == false and .prerelease == false)
                | .tag_name
                | select(test("^v?[0-9]+[.][0-9]+[.][0-9]+$"))
              )
              | max_by(sub("^v"; "") | split(".") | map(tonumber))
              // empty
            '
          }

          # Resolve a tag to the COMMIT it points at.
          #
          # This replaces `git ls-remote <repo> refs/tags/<tag>^{}` plus its
          # fallback for lightweight tags. The two-step dance is not needed over
          # REST: /commits/<ref> resolves a ref of any kind and always yields a
          # commit, so an annotated tag is peeled server-side. Verified against
          # `git ls-remote ... ^{}` for all five components -- identical SHAs,
          # and for aardvark-dns v2.0.0 it agrees with the SHA recorded in the
          # last release's manifest.json.
          #
          # Do NOT be tempted by .target_commitish on the release object: that is
          # frequently a branch name ("main") rather than a SHA, and it records
          # where the release was cut FROM, not what the tag resolves TO.
          tag_commit() {
            gh api "repos/${1}/commits/${2}" --jq '.sha'
          }

          # The default branch tip, for the head fallback in
          # build-podman-packages.yaml: when a component will not build from its
          # release tag, the build retries from here on the theory that upstream
          # has already merged a fix but not yet tagged one. That is not
          # hypothetical -- aardvark-dns v2.1.0 has not compiled against musl
          # since 2026-08-06, and the fix (containers/aardvark-dns#731) has sat
          # on main, untagged, since 2026-08-11.
          #
          # Emits "<branch> <sha> <YYYYMMDDHHMMSS>". The stamp is the COMMIT's own
          # committer date, not the wall clock, so re-resolving the same head
          # twice produces the same snapshot version and the same cache key.
          #
          # To the SECOND, not the day. A day-resolution stamp gives two commits
          # landing on the same date the same snapshot version, and the component
          # cache is keyed on version -- so the second run would restore the first
          # commit's .apk while the manifest recorded the second commit's SHA.
          # The cache entry's provenance is verified on top of this (see
          # components/attempt), but the identity should not be ambiguous in the
          # first place.
          #
          # The branch name is resolved rather than assumed: catatonit is not
          # under containers/ and need not share its conventions.
          head_spec() {
            local repo="$1" branch
            branch="$(gh api "repos/${repo}" --jq '.default_branch')"
            printf '%s %s\n' \
              "${branch}" \
              "$(
                gh api "repos/${repo}/commits/${branch}" \
                  --jq '.sha + " " + (.commit.committer.date | gsub("[-:TZ]"; ""))'
              )"
          }

          previous="$(mktemp)"
          # Without an explicit tag, gh release download resolves GitHub's
          # "latest" release. Once the first stable proxmox/* release exists
          # it becomes "latest", making every .components[$c].version // ""
          # read empty and marking every component as changed -- triggering a
          # full podman rebuild every week even when nothing upstream moved.
          previous_podman_tag=""
          ri_rc=0
          previous_podman_tag="$(
            .github/scripts/release-identity.sh previous podman
          )" || ri_rc=$?

          if [[ "${ri_rc}" -eq 0 ]]; then
            if gh release download "${previous_podman_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern manifest.json --output "${previous}" 2> /dev/null; then
              echo "::notice::comparing against $(jq -r '.tag' "${previous}")"
            else
              echo "::notice::no previous release; bootstrapping from upstream latest"
              echo '{"components":{}}' > "${previous}"
            fi
          elif [[ "${ri_rc}" -eq 65 ]]; then
            echo "::notice::no previous release; bootstrapping from upstream latest"
            echo '{"components":{}}' > "${previous}"
          elif [[ "${ri_rc}" -eq 66 ]]; then
            echo "::error::release list was truncated; podman previous release not found"
            echo "::error::cannot safely determine previous versions; refusing to proceed"
            exit 1
          else
            echo "::error::release-identity.sh previous podman failed (exit ${ri_rc})"
            exit 1
          fi

          components='{}'
          changed=false
          major=false
          summary=''

          for component in podman netavark aardvark-dns buildah catatonit; do
            repo="${repos[${component}]}"

            tag="$(latest_tag "${repo}")"
            if [[ -z "${tag}" ]]; then
              echo "::error::no stable semver release for ${component} in ${repo}"
              exit 1
            fi
            version="${tag#v}"

            # Pin the build to a SHA rather than a mutable ref. `gh api` exits
            # non-zero on an HTTP error and this runs under `set -e`, so a 404
            # here aborts the run; the emptiness check is for a 200 that somehow
            # carried no sha.
            commit="$(tag_commit "${repo}" "${tag}")"
            if [[ -z "${commit}" ]]; then
              echo "::error::could not resolve a commit for ${component} ${tag}"
              exit 1
            fi

            old_version="$(jq -r --arg c "${component}" \
              '.components[$c].version // ""' "${previous}")"

            if [[ "${old_version}" != "${version}" ]]; then
              changed=true
              summary+="- ${component}: ${old_version:-none} -> ${version}"$'\n'
              echo "::notice::${component}: ${old_version:-none} -> ${version}"

              # A bump is "major" only when there is something to compare
              # against; a bootstrap run is not a major event.
              if [[ -n "${old_version}" ]]; then
                if [[ "${version%%.*}" != "${old_version%%.*}" ]]; then
                  major=true
                  echo "::warning::${component} crosses a major version"
                fi
              fi
            fi

            # The head candidate, for eligible components only. Resolved for
            # EVERY run rather than only for known-broken components, because
            # nothing here knows what will fail -- the build does, an hour later
            # and two workflows down, at which point going back for a SHA is not
            # possible. Two API calls per helper is a cheap thing to always pay.
            head='null'
            if [[ -n "${head_eligible[${component}]:-}" ]]; then
              read -r head_branch head_commit head_date < <(head_spec "${repo}")
              head="$(
                jq -nc \
                  --arg b "${head_branch}" --arg s "${head_commit}" --arg d "${head_date}" \
                  '{branch: $b, commit: $s, date: $d}'
              )"
              echo "::notice::${component}: head candidate ${head_branch}@${head_commit:0:7} (${head_date})"
            fi

            # The last known good version, carried forward so the build can hold
            # a component here when BOTH its tag and its head fail. Null on a
            # bootstrap run, where there is nothing to hold at and a total
            # failure is simply a failure.
            previous_spec="$(
              jq -c --arg c "${component}" \
                '.components[$c] // null
                  | if . == null then null else {version: .version, commit: .commit} end' \
                "${previous}"
            )"

            # `tag` is carried verbatim alongside the bare version. latest_tag
            # accepts "^v?", so a component whose upstream publishes "1.2.3"
            # rather than "v1.2.3" resolves fine here -- but the build would then
            # reconstruct "v1.2.3" and ask for a ref that does not exist, taking
            # a pointless head fallback or failing outright. Record what was
            # actually resolved rather than making the far end guess.
            components="$(
              jq -c \
                --arg c "${component}" --arg v "${version}" --arg t "${tag}" \
                --arg s "${commit}" \
                --argjson h "${head}" --argjson p "${previous_spec}" \
                '.[$c] = {version: $v, tag: $t, commit: $s, head: $h, previous: $p}' \
                <<< "${components}"
            )"
          done

          if [[ "${changed}" == false ]]; then
            echo "::notice::everything is up to date; nothing to build"
            summary='no changes'
          fi

          {
            echo "changed=${changed}"
            echo "major=${major}"
            echo "components=${components}"
            echo "summary<<SUMMARY_EOF"
            printf '%s' "${summary}"
            echo
            echo "SUMMARY_EOF"
          } >> "${GITHUB_OUTPUT}"

          jq . <<< "${components}"

  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      # release.yaml's `test` job requests `actions: read` so it can resolve
      # build artifacts through the API. A reusable workflow cannot grant itself
      # more than its caller allows, and this omission is rejected at workflow
      # *validation* time -- the run fails before any job starts, with
      # "The nested job 'test' is requesting 'actions: read', but is only
      # allowed 'actions: none'". Nothing in this file mentions `actions`, so
      # the error names a permission that appears nowhere near the workflow
      # that failed. release.yaml already carries the same grant one level down
      # for the same reason; it simply was never propagated up to this caller.
      actions: read
      # release.yaml's `announce-fallback` job files the tracking issue when a
      # component could not be built from its release tag. Same propagation rule
      # as `actions: read` above -- a called workflow cannot grant itself more
      # than its caller holds, and the omission is rejected at workflow
      # VALIDATION time, so the run dies before any job starts with an error
      # naming a permission that appears nowhere in this file.
      issues: write
    # Named explicitly, NOT `secrets: inherit`. A called workflow receives no
    # secrets by default, and inherit would forward every secret this repository
    # holds when release.yaml needs exactly one.
    secrets:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
    uses: ./.github/workflows/release.yaml
    with:
      components: ${{ needs.detect.outputs.components }}
      prerelease: ${{ needs.detect.outputs.major == 'true' }}
      reason: >-
        Scheduled upstream watch (${{ needs.detect.outputs.major == 'true'
        && 'major bump, soaking as prerelease' || 'minor/patch' }})

  # A major bump reaching the prerelease lane is worth a durable record: the
  # notice in the run log disappears from view, an issue does not.
  announce-major:
    name: Open a tracking issue for the major bump
    runs-on: ubuntu-latest
    needs:
      - detect
      - release
    if: needs.detect.outputs.major == 'true'
    permissions:
      contents: read
      issues: write

    steps:
      - name: File or update the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.detect.outputs.summary }}
        run: |
          set -euo pipefail

          title='Major upstream bump soaking as a prerelease'

          # printf rather than a heredoc: a heredoc terminator has to sit at
          # column 0, which would close the surrounding YAML block scalar.
          body="$(
            printf '%s\n' \
              'A component crossed a major version, so the build was published' \
              'as a prerelease rather than a full release, and was not' \
              'dispatched to the APT control plane.' \
              '' \
              'It is promoted automatically once the soak window elapses,' \
              'provided the acceptance suite still passes against the' \
              'published assets.' \
              '' \
              'Closing this issue is acknowledgement only; it does not gate' \
              'promotion. What *does* hold a promotion is an open issue whose' \
              'title contains the prerelease tag itself.' \
              ''
            printf '%s\n' "${SUMMARY}"
          )"

          existing="$(
            gh issue list --repo "${GITHUB_REPOSITORY}" \
              --state open --search "${title} in:title" \
              --json number --jq '.[0].number // ""'
          )"

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" --body "${body}" --label automated
          fi
