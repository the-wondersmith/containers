---
name: Publish to APT repository

# The manual escape hatch: the only path covering a release published by a human
# or a PAT.
#
# The two automated paths dispatch to the control plane themselves, and neither
# can reach this workflow. A release created with the default GITHUB_TOKEN does
# not fire `release: published` (GitHub's anti-recursion rule), and clearing the
# prerelease flag fires `released`, not `published`. So this exists for the one
# case they do not cover -- and, since the control plane derives its ingest
# target solely from a repository_dispatch payload, it is the only way to ingest
# a hand-published release short of hand-rolling that payload.
#
# It therefore cannot be exercised by CI and will never accumulate a green run.
# The absence of runs is expected, not breakage.
#
# That is exactly why it preflights rather than dispatching blind: every check
# below mirrors one the control plane makes, in the same order, so a malformed
# release fails here -- in the repository whose owner just published it, with a
# message naming the problem -- instead of failing in the-wondersmith/apt where
# nobody is watching.

on:
  release:
    types:
      - published

permissions:
  contents: read
  # `gh attestation verify` reads the attestation through the API.
  attestations: read

jobs:
  notify:
    name: Dispatch publish-deb to APT control plane
    runs-on: ubuntu-latest

    # Prereleases must not reach the APT repository. A major bump is published
    # as a prerelease and only promoted after the soak window, at which point
    # promote-prerelease.yaml dispatches on its own.
    if: ${{ !github.event.release.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git; do not leave the token on disk.
          persist-credentials: false

      - name: Authorize the triggering actor
        uses: ./.github/actions/authorize-actor
        with:
          allow-dependabot: "false"

      - name: Preflight the release against what the control plane requires
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          assets="$(
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name'
          )"

          echo "assets on ${TAG}:"
          while IFS= read -r asset; do
            echo "  ${asset}"
          done <<< "${assets}"

          debs=()
          while IFS= read -r asset; do
            [[ "${asset}" == *.deb ]] && debs+=("${asset}")
          done <<< "${assets}"

          # (1) There must be .deb assets at all. The control plane errors with
          #     "no .deb assets on <repo>@<tag>".
          if [[ "${#debs[@]}" -eq 0 ]]; then
            echo "::error::${TAG} has no .deb assets; the control plane would reject it"
            exit 1
          fi

          # (2) Architecture floor. The control plane requires each package to be
          #     Architecture: all, or to provide BOTH amd64 and arm64 -- a partial
          #     set leaves the repository inconsistent for half its users. Checked
          #     here by name, which is sound because dpkg puts the architecture in
          #     the filename.
          #
          #     The `all` branch is not a loophole. An Architecture: all package is
          #     one build that is correct on every architecture, and the control
          #     plane emits its stanza into every binary-<arch> index, so a single
          #     _all.deb satisfies both users. Requiring per-arch files as well
          #     would demand builds that cannot exist.
          if printf '%s\n' "${debs[@]}" | grep -q '_all\.deb$'; then
            echo "architecture floor satisfied by an Architecture: all package"
          else
            for arch in amd64 arm64; do
              if ! printf '%s\n' "${debs[@]}" | grep -q "_${arch}\.deb$"; then
                echo "::error::${TAG} has no ${arch} .deb and no _all.deb"
                echo "::error::publish either an Architecture: all package or both architectures"
                printf '  %s\n' "${debs[@]}" >&2
                exit 1
              fi
            done
          fi

          # (3) manifest.json is this repository's own release contract: the
          #     upstream watcher diffs against it and the identity job reads
          #     pkgrel back out of it. A release without one was not produced by
          #     release.yaml, and publishing it would strand the next release's
          #     version derivation.
          if ! grep -qx 'manifest.json' <<< "${assets}"; then
            echo "::error::${TAG} has no manifest.json; it was not produced by release.yaml"
            exit 1
          fi

          # (4) The check with actual teeth, and the one a hand-made release is
          #     most likely to fail: every .deb must carry a provenance
          #     attestation whose signer identity is this repository. A locally
          #     built .deb verifies against nothing.
          #
          #     --signer-repo is what makes this meaningful. Only the signing
          #     certificate's identity is unforgeable, so it is pinned here for
          #     the same reason the control plane pins it.
          mkdir -p preflight
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.deb' --dir preflight

          while IFS= read -r deb; do
            if ! gh attestation verify "${deb}" \
              --repo "${GITHUB_REPOSITORY}" --signer-repo "${GITHUB_REPOSITORY}"; then
              echo "::error::no valid provenance attestation for ${deb##*/}"
              exit 1
            fi
            echo "attested: ${deb##*/}"
          done < <(find preflight -type f -name '*.deb')

          echo "preflight passed: ${#debs[@]} .deb assets, architecture floor met, all attested"

      - name: Notify the APT control plane
        uses: ./.github/actions/apt-dispatch
        with:
          tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.APT_DISPATCH_TOKEN }}
