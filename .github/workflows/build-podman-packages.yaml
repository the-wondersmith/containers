---
name: Build Podman Packages

# Versions arrive as inputs. There is no versions.yaml and no committed state:
# the upstream watcher resolves upstream tags, diffs them against the last
# release's manifest, and calls this workflow with the result.
#
# Both triggers take a single `components` JSON blob rather than one input per
# component. workflow_dispatch caps out at ten inputs, and five components x
# (version, commit) already reaches that ceiling before pkgrel is counted.
#
# Shape:
#   {
#     "podman":       {"version": "6.0.2",  "commit": "b28edb9..."},
#     "netavark":     {"version": "2.0.0",  "commit": "dd456fb..."},
#     "aardvark-dns": {"version": "2.0.0",  "commit": "d98c599..."},
#     "buildah":      {"version": "1.45.0", "commit": "7ae7d5a..."},
#     "catatonit":    {"version": "0.2.1",  "commit": "bb3b96b..."}
#   }

on:
  workflow_call:
    inputs:
      components:
        required: true
        type: string
        description: JSON object mapping each component to its version and commit.
      pkgrel:
        required: false
        type: string
        default: "1"
        description: >-
          Package release number. Resets to 1 when podman's own version moves
          and increments otherwise, so a release driven only by a bundled
          component bump still yields a distinguishable package.
    outputs:
      components:
        description: >-
          The EFFECTIVE component set, i.e. what was actually built rather than
          what was requested. Identical to the `components` input unless a
          component fell back to upstream head or held at its last known good
          version. Callers must record this one -- writing the requested set into
          a release manifest would mean the next run diffs against versions that
          were never shipped.
        value: ${{ jobs.resolve-effective.outputs.components }}
      snapshot:
        description: >-
          "true" when at least one component was built from an untagged upstream
          snapshot. release.yaml turns this into a forced prerelease.
        value: ${{ jobs.resolve-effective.outputs.snapshot }}
      held:
        description: >-
          "true" when at least one component could be built from neither its tag
          nor upstream head and was held at its last known good version.
        value: ${{ jobs.resolve-effective.outputs.held }}
      fallback-summary:
        description: Human-readable per-component account of any fallback.
        value: ${{ jobs.resolve-effective.outputs.summary }}
  workflow_dispatch:
    inputs:
      components:
        required: true
        type: string
        description: JSON object mapping each component to its version and commit.
      pkgrel:
        required: false
        type: string
        default: "1"
        description: Package release number.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ !(startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) }}

# Read-only by default. `packages: write` is granted per job, only to the two
# that actually publish to the GHCR component cache -- the assembly jobs consume
# components through artifacts and have no business writing to the registry.
permissions:
  contents: read

jobs:
  # A single gate for the whole workflow.
  #
  # This workflow carries a workflow_dispatch trigger, so it is an entry point in
  # its own right and not only ever reached through release.yaml's gate. It holds
  # `packages: write` and builds untrusted upstream source as root.
  #
  # It has to be its own job: `components` and `podman-gnu` are both roots with no
  # `needs`, so gating either one alone would leave the other running for an
  # unauthorized dispatch. Everything hangs off this instead.
  #
  # Harmless on the release path -- release.yaml has already gated by then, and
  # the actor is the same identity.
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git; do not leave the token on disk.
          persist-credentials: false

      - name: Authorize the triggering actor
        uses: ./.github/actions/authorize-actor

  # ───────────────────────────────────────────────────────────────────────────
  # Static musl components, shared verbatim between the .deb and the .apk.
  # Each is looked up in GHCR first and only built on a miss, so a release
  # triggered by (say) a buildah bump rebuilds buildah alone.
  # ───────────────────────────────────────────────────────────────────────────
  components:
    needs: authorize
    permissions:
      contents: read
      packages: write
    name: ${{ matrix.component }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        # `arch` MUST be a real matrix dimension, not something contributed only
        # by `include`. An `include` entry that does not overwrite an original
        # matrix value is applied to *every* combination, so listing the two
        # arches there alone produced 5 jobs rather than 10 -- both entries
        # applied to all five components and the second won, leaving everything
        # on aarch64. Nothing failed loudly: the x86_64 components simply never
        # built, and the error surfaced two jobs later as a missing .apk in the
        # packaging steps.
        component:
          - catatonit
          - netavark
          - aardvark-dns
          - buildah
          - podman
        arch:
          - x86_64
          - aarch64
        # Now that `arch` is an original value, these attach a runner to the
        # existing combinations that already match on it.
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git, and several go on to build
          # untrusted upstream source as root. Leaving the token in
          # .git/config gives that code something to read.
          persist-credentials: false

      - name: Provision the tool set
        uses: ./.github/actions/prepare-ci-env

      - name: Resolve this component's version and commit
        id: spec
        shell: bash
        env:
          COMPONENTS: ${{ inputs.components }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail

          version="$(jq -er --arg c "${COMPONENT}" '.[$c].version' <<< "${COMPONENTS}")"
          commit="$(jq -er --arg c "${COMPONENT}" '.[$c].commit' <<< "${COMPONENTS}")"

          # Read the upstream repository out of the definition rather than
          # assuming containers/<component>: catatonit lives under openSUSE, so
          # the assumption produced a wrong provenance annotation on its cached
          # component.
          repository="$(
            mise x -- yq -r \
              '(.pipeline[] | select(.uses == "git-checkout") | .with.repository) // ""' \
              "packaging/melange/${COMPONENT}.yaml"
          )"

          if [[ -z "${repository}" ]]; then
            echo "::error::no git-checkout repository in packaging/melange/${COMPONENT}.yaml"
            exit 1
          fi

          # The head candidate, present only for components upstream-watch marked
          # eligible (the four helpers; never podman). Absent entirely on a
          # manual dispatch carrying a hand-written components JSON, which is
          # fine -- no head entry simply means "tag or nothing", the behaviour
          # this workflow had before the fallback existed.
          head_commit="$(jq -r --arg c "${COMPONENT}" '.[$c].head.commit // ""' <<< "${COMPONENTS}")"
          head_branch="$(jq -r --arg c "${COMPONENT}" '.[$c].head.branch // ""' <<< "${COMPONENTS}")"
          head_date="$(jq -r --arg c "${COMPONENT}" '.[$c].head.date // ""' <<< "${COMPONENTS}")"

          # The last known good release, for the case where BOTH the tag and the
          # head fail. Holding here is not a snapshot -- it is a version that was
          # already built, tested and published -- so it does not force the
          # release onto the prerelease lane the way a head build does.
          prev_version="$(jq -r --arg c "${COMPONENT}" '.[$c].previous.version // ""' <<< "${COMPONENTS}")"
          prev_commit="$(jq -r --arg c "${COMPONENT}" '.[$c].previous.commit // ""' <<< "${COMPONENTS}")"

          # Two spellings of the same snapshot, because no single string is legal
          # in both ecosystems:
          #
          #   apk     2.1.0_git20260914        `_git` is a recognised apk suffix.
          #                                    `+` is not, so the Debian form is
          #                                    not usable here.
          #   Debian  2.1.0+git20260914.7a35305
          #                                    `_` is not a legal character in a
          #                                    Debian version at all, so the apk
          #                                    form is not usable there.
          #
          # Both sort after the plain release version in their own ecosystem,
          # though nothing here depends on that: these versions are only ever
          # used as exact identifiers (cache tags, `Provides: x (= y)`, `=` in
          # apk provides), never compared as ranges.
          head_version=""
          head_deb_version=""
          if [[ -n "${head_commit}" ]]; then
            head_version="${version}_git${head_date}"
            head_deb_version="${version}+git${head_date}.${head_commit:0:7}"
          fi

          {
            echo "version=${version}"
            echo "commit=${commit}"
            echo "repository=${repository}"
            echo "head-commit=${head_commit}"
            echo "head-branch=${head_branch}"
            echo "head-version=${head_version}"
            echo "head-deb-version=${head_deb_version}"
            echo "prev-version=${prev_version}"
            echo "prev-commit=${prev_commit}"
          } >> "${GITHUB_OUTPUT}"

      # ── act only ────────────────────────────────────────────────────────────
      # melange's docker runner creates its workspace and then asks the DAEMON to
      # bind-mount it into the build pod. On a GitHub runner the daemon is on the
      # same host, so melange's default /tmp/melange-workspace-* resolves fine and
      # this step is skipped entirely.
      #
      # Under act the job itself runs in a container while the daemon is the
      # host's, so a path inside the job is invisible to it:
      #
      #   invalid mount config for type "bind": bind source path does not exist:
      #   /tmp/melange-workspace-...
      #
      # GITHUB_WORKSPACE is host-visible because `act --bind` preserves host paths
      # verbatim. Unique per component+arch: act runs matrix legs concurrently in
      # one workspace, and a shared directory makes them race on the git checkout
      # inside the guest -- "Unable to create '/home/build/.git/shallow.lock'".
      #
      # No longer gated on a cache miss: it exports MELANGE_WORKSPACE to the JOB,
      # and the attempts below each decide their own cache outcome, so there is no
      # single restore step left to gate on.
      - name: Point melange at a host-visible workspace (act only)
        if: ${{ env.ACT || vars.act }}
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          workspace="${GITHUB_WORKSPACE}/.melange-workspace/${COMPONENT}-${ARCH}"
          rm -rf "${workspace}"
          mkdir -p "${workspace}"

          echo "MELANGE_WORKSPACE=${workspace}" >> "${GITHUB_ENV}"
          echo "::notice::act detected; melange workspace pinned to ${workspace}"

      # ── The three attempts ──────────────────────────────────────────────────
      #
      # 1. the upstream release tag          -- the normal path, and the only
      #                                         path podman ever takes
      # 2. the upstream default branch head  -- helpers only; catches the case
      #                                         where upstream has merged a fix
      #                                         but not yet tagged a release
      # 3. the last known good version       -- neither of the above built, so
      #                                         hold rather than wedge the whole
      #                                         release on one broken component
      #
      # `continue-on-error` on the first two is what makes this a fallback chain
      # rather than three ways to fail. The final decide step is what turns
      # "everything was allowed to fail" back into a hard error when it should be.
      - name: Attempt 1 - build from the release tag
        id: attempt-tag
        continue-on-error: true
        uses: ./.github/actions/components/attempt
        with:
          component: ${{ matrix.component }}
          arch: ${{ matrix.arch }}
          version: ${{ steps.spec.outputs.version }}
          commit: ${{ steps.spec.outputs.commit }}
          ref-kind: tag
          ref: v${{ steps.spec.outputs.version }}
          repository: ${{ steps.spec.outputs.repository }}
          token: ${{ github.token }}

      - name: Attempt 2 - build from upstream head
        id: attempt-head
        if: >-
          steps.attempt-tag.outcome == 'failure'
          && steps.spec.outputs.head-commit != ''
        continue-on-error: true
        uses: ./.github/actions/components/attempt
        with:
          component: ${{ matrix.component }}
          arch: ${{ matrix.arch }}
          version: ${{ steps.spec.outputs.head-version }}
          commit: ${{ steps.spec.outputs.head-commit }}
          ref-kind: branch
          ref: ${{ steps.spec.outputs.head-branch }}
          repository: ${{ steps.spec.outputs.repository }}
          token: ${{ github.token }}

      - name: Attempt 3 - hold at the last known good version
        id: attempt-hold
        if: >-
          steps.attempt-tag.outcome == 'failure'
          && steps.attempt-head.outcome != 'success'
          && steps.spec.outputs.prev-version != ''
        continue-on-error: true
        uses: ./.github/actions/components/attempt
        with:
          component: ${{ matrix.component }}
          arch: ${{ matrix.arch }}
          version: ${{ steps.spec.outputs.prev-version }}
          commit: ${{ steps.spec.outputs.prev-commit }}
          ref-kind: tag
          ref: v${{ steps.spec.outputs.prev-version }}
          repository: ${{ steps.spec.outputs.repository }}
          token: ${{ github.token }}

      # Collapse the three outcomes into one effective spec, and fail here if
      # none of them produced anything. Without this step every attempt is
      # `continue-on-error`, so the job would go green having built nothing and
      # the missing .apk would surface two jobs later as a packaging error that
      # names neither the component nor the reason.
      - name: Decide which attempt won
        id: effective
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          TAG_OUTCOME: ${{ steps.attempt-tag.outcome }}
          HEAD_OUTCOME: ${{ steps.attempt-head.outcome }}
          HOLD_OUTCOME: ${{ steps.attempt-hold.outcome }}
          TAG_VERSION: ${{ steps.spec.outputs.version }}
          TAG_COMMIT: ${{ steps.spec.outputs.commit }}
          HEAD_VERSION: ${{ steps.spec.outputs.head-version }}
          HEAD_DEB_VERSION: ${{ steps.spec.outputs.head-deb-version }}
          HEAD_COMMIT: ${{ steps.spec.outputs.head-commit }}
          PREV_VERSION: ${{ steps.spec.outputs.prev-version }}
          PREV_COMMIT: ${{ steps.spec.outputs.prev-commit }}
        run: |
          set -euo pipefail

          if [[ "${TAG_OUTCOME}" == "success" ]]; then
            built_from="tag"
            version="${TAG_VERSION}"
            deb_version="${TAG_VERSION}"
            commit="${TAG_COMMIT}"
          elif [[ "${HEAD_OUTCOME}" == "success" ]]; then
            built_from="head"
            version="${HEAD_VERSION}"
            deb_version="${HEAD_DEB_VERSION}"
            commit="${HEAD_COMMIT}"
            echo "::warning::${COMPONENT} ${TAG_VERSION} failed to build; using upstream head ${commit} as ${version}"
          elif [[ "${HOLD_OUTCOME}" == "success" ]]; then
            built_from="hold"
            version="${PREV_VERSION}"
            deb_version="${PREV_VERSION}"
            commit="${PREV_COMMIT}"
            echo "::warning::${COMPONENT} ${TAG_VERSION} and upstream head both failed; holding at ${version}"
          else
            echo "::error::${COMPONENT} (${ARCH}) could not be built from any candidate"
            echo "::error::  release tag ${TAG_VERSION}: ${TAG_OUTCOME}"
            echo "::error::  upstream head: ${HEAD_OUTCOME:-not attempted}"
            echo "::error::  last known good ${PREV_VERSION:-none}: ${HOLD_OUTCOME:-not attempted}"
            exit 1
          fi

          # One .apk, no more and no less. The attempt action clears its output
          # directory before each try, so more than one here means two attempts
          # both produced output, which would make the bundle non-deterministic.
          shopt -s nullglob
          built=(components/*.apk)
          if [[ "${#built[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one .apk in components/, found ${#built[@]}"
            printf '%s\n' "${built[@]}" >&2
            exit 1
          fi

          mkdir -p specs
          jq -nc \
            --arg component "${COMPONENT}" \
            --arg arch "${ARCH}" \
            --arg source "${built_from}" \
            --arg version "${version}" \
            --arg deb_version "${deb_version}" \
            --arg commit "${commit}" \
            '{component: $component, arch: $arch, source: $source,
              version: $version, deb_version: $deb_version, commit: $commit}' \
            > "specs/${COMPONENT}-${ARCH}.json"

          cat "specs/${COMPONENT}-${ARCH}.json"

      - name: Upload the effective spec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: spec-${{ matrix.component }}-${{ matrix.arch }}
          path: specs/*.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload the component for the packaging jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: component-${{ matrix.component }}-${{ matrix.arch }}
          path: components/*.apk
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # The one dynamically linked component: podman against glibc, with the
  # systemd build tag, for the Debian package only.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Reconcile what the component matrix actually built.
  #
  # Each (component, arch) leg decided independently whether it had to fall back,
  # and each published an effective spec. This job merges those ten specs into
  # one component set and answers the two questions the release needs:
  # did anything ship from an untagged snapshot, and did anything hold back.
  #
  # It exists as a separate job because matrix legs cannot contribute to a shared
  # output -- concurrent writes to the same job output collide, last writer wins,
  # silently. Artifacts are the only aggregation channel GitHub actually offers.
  # ───────────────────────────────────────────────────────────────────────────
  resolve-effective:
    name: Reconcile built versions
    needs: components
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      components: ${{ steps.merge.outputs.components }}
      snapshot: ${{ steps.merge.outputs.snapshot }}
      held: ${{ steps.merge.outputs.held }}
      summary: ${{ steps.merge.outputs.summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Collect the effective specs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: spec-*
          path: specs
          merge-multiple: true

      - name: Merge into one effective component set
        id: merge
        shell: bash
        env:
          REQUESTED: ${{ inputs.components }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(specs/*.json)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::no effective specs were uploaded by the component matrix"
            exit 1
          fi

          # Both architectures must agree on what they built. They decide
          # independently, so a component that fails to compile on one arch and
          # not the other would otherwise produce a bundle whose x86_64 and
          # aarch64 halves ship different upstream code under one version.
          #
          # That is rare enough to be worth a human rather than a policy: almost
          # every build break is a source-level one and hits both arches
          # identically, which is exactly what aardvark-dns v2.1.0 does.
          disagreements="$(
            jq -s -r '
              group_by(.component)[]
              | select((map({source, version, commit}) | unique | length) > 1)
              | .[0].component
            ' "${files[@]}"
          )"
          if [[ -n "${disagreements}" ]]; then
            echo "::error::architectures disagree on what was built:"
            printf '%s\n' "${disagreements}" >&2
            jq -s -r '.[] | "  \(.component) \(.arch): \(.source) \(.version) \(.commit)"' \
              "${files[@]}" >&2
            echo "::error::refusing to assemble a package from mismatched component builds" >&2
            exit 1
          fi

          # Fold the per-arch specs down to one entry per component, then graft
          # the result onto the REQUESTED set so that fields the build does not
          # own -- head, previous -- survive into the manifest for the next run.
          effective="$(
            jq -s -c --argjson requested "${REQUESTED}" '
              (group_by(.component)
                | map({key: .[0].component,
                      value: {version: .[0].version,
                              deb_version: .[0].deb_version,
                              commit: .[0].commit,
                              source: .[0].source}})
                | from_entries) as $built
              | $requested
              | to_entries
              | map(.value += ($built[.key] // {}))
              | from_entries
            ' "${files[@]}"
          )"

          snapshot=false
          held=false
          summary=""

          while read -r component source version commit; do
            case "${source}" in
              head)
                snapshot=true
                summary+="- ${component}: tag build failed, built from upstream head ${commit:0:7} as ${version}"$'\n'
                echo "::warning::${component} built from an untagged snapshot (${version})"
                ;;
              hold)
                held=true
                summary+="- ${component}: tag and head both failed, held at ${version}"$'\n'
                echo "::warning::${component} held at last known good ${version}"
                ;;
            esac
          done < <(
            jq -r 'to_entries[]
                    | select(.value.source != null and .value.source != "tag")
                    | "\(.key) \(.value.source) \(.value.version) \(.value.commit)"' \
              <<< "${effective}"
          )

          {
            echo "components=${effective}"
            echo "snapshot=${snapshot}"
            echo "held=${held}"
            echo "summary<<SUMMARY_EOF"
            printf '%s' "${summary}"
            echo
            echo "SUMMARY_EOF"
          } >> "${GITHUB_OUTPUT}"

          jq . <<< "${effective}"

  podman-gnu:
    needs: authorize
    permissions:
      contents: read
      packages: write
    name: podman-gnu / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb-arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            deb-arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          set -eu
          apt-get update -q
          # jq comes from mise; curl/git/tar are what mise-action needs to
          # bootstrap itself, and are not tools mise is responsible for.
          apt-get install -y --no-install-recommends ca-certificates curl git tar

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git, and several go on to build
          # untrusted upstream source as root. Leaving the token in
          # .git/config gives that code something to read.
          persist-credentials: false

      # ── act only ────────────────────────────────────────────────────────────
      # jdx/mise-action is a Node action. On GitHub, the runner injects its own
      # node into `container:` jobs; act does not, so mise-action dies with
      #
      #   exec: "node": executable file not found in $PATH
      #
      # Installing the distro node is enough for act to exec the action. Skipped
      # entirely on a real runner, which supplies its own.
      - name: Install node for mise-action (act only)
        if: ${{ env.ACT || vars.act }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends nodejs
          node --version

      - name: Provision the tool set
        uses: ./.github/actions/prepare-ci-env

      - name: Resolve podman's version and commit
        id: spec
        shell: bash
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          {
            echo "version=$(jq -er '.podman.version' <<< "${COMPONENTS}")"
            echo "commit=$(jq -er '.podman.commit' <<< "${COMPONENTS}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Look for an existing build
        id: restore
        uses: ./.github/actions/components/restore
        with:
          component: podman
          version: ${{ steps.spec.outputs.version }}
          target: ${{ matrix.arch }}-linux-gnu
          recipe: .github/actions/build/podman-gnu/action.yaml
          dest: components
          token: ${{ github.token }}

      - name: Build podman against glibc
        if: steps.restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/build/podman-gnu
        with:
          version: ${{ steps.spec.outputs.version }}
          commit: ${{ steps.spec.outputs.commit }}
          destdir: ${{ runner.temp }}/podman-gnu

      - name: Pack the staging tree
        if: steps.restore.outputs.cache-hit != 'true'
        shell: bash
        env:
          DESTDIR: ${{ runner.temp }}/podman-gnu
          VERSION: ${{ steps.spec.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p components
          tar -czf "components/podman-gnu-${VERSION}-${ARCH}.tar.gz" -C "${DESTDIR}" .

      - name: Publish the component to the cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/components/save
        with:
          reference: ${{ steps.restore.outputs.reference }}
          artifact: components/podman-gnu-${{ steps.spec.outputs.version }}-${{ matrix.arch }}.tar.gz
          upstream-repo: https://github.com/containers/podman
          upstream-tag: v${{ steps.spec.outputs.version }}
          upstream-commit: ${{ steps.spec.outputs.commit }}
          token: ${{ github.token }}

      - name: Upload the component for the packaging job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: component-podman-gnu-${{ matrix.arch }}
          path: components/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Assembly. Neither job compiles anything.
  # ───────────────────────────────────────────────────────────────────────────
  package-alpine:
    permissions:
      contents: read
    name: .apk / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - components
      - resolve-effective

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git, and several go on to build
          # untrusted upstream source as root. Leaving the token in
          # .git/config gives that code something to read.
          persist-credentials: false

      - name: Prepare CI environment
        uses: ./.github/actions/prepare-ci-env

      - name: Collect the built components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: component-*-${{ matrix.arch }}
          merge-multiple: true
          path: .melange-src/components

      - name: Stage the bundle inputs
        shell: bash
        env:
          # The EFFECTIVE set. The bundle's versioned `provides` must name the
          # components actually inside it; using inputs.components here would
          # have a fallback build claim to provide a netavark release it does
          # not contain.
          COMPONENTS: ${{ needs.resolve-effective.outputs.components }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail

          # The glibc podman tarball is for the Debian package only; it must not
          # end up in the Alpine bundle.
          rm -f .melange-src/components/podman-gnu-*.tar.gz

          # Assert the component set is complete for THIS arch before melange is
          # invoked, and name everything that is missing rather than stopping at
          # the first gap.
          #
          # The bundle definition only checks that components/ is non-empty, so a
          # partial download used to produce a package that was quietly missing
          # binaries, or a confusing melange error much later. A half-populated
          # matrix is the realistic cause: see the note on `arch` in the
          # component job's matrix above.
          missing=()
          for component in $(jq -r 'keys[]' <<< "${COMPONENTS}"); do
            version="$(jq -er --arg c "${component}" '.[$c].version' <<< "${COMPONENTS}")"
            apk=".melange-src/components/${component}-${version}-r0.apk"
            [[ -f "${apk}" ]] || missing+=("${apk}")
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::incomplete component set for ${{ matrix.arch }}; missing ${#missing[@]}:"
            printf '  %s\n' "${missing[@]}" >&2
            echo "present:" >&2
            ls -la .melange-src/components >&2
            exit 1
          fi

          echo "component set complete for ${{ matrix.arch }}"

          # The bundle reads its Alpine-specific inputs from alpine/. The helpers
          # fragment is shared with the Debian package, so it lives one level up
          # and is copied in.
          cp -r packaging/podman/alpine .melange-src/alpine
          cp packaging/podman/50-bundled-helpers.conf .melange-src/alpine/

          definition=packaging/melange/podman-bundle.yaml

          yq -i ".package.version = \"$(jq -er '.podman.version' <<< "${COMPONENTS}")\"" "${definition}"
          yq -i ".package.epoch = ${PKGREL}" "${definition}"

          # Versioned provides must track the versions actually bundled.
          for component in netavark aardvark-dns catatonit buildah; do
            version="$(jq -er --arg c "${component}" '.[$c].version' <<< "${COMPONENTS}")"
            yq -i \
              "(.package.dependencies.provides[] | select(. == \"${component}=*\")) = \"${component}=${version}\"" \
              "${definition}"
          done

          # As with the component definitions, the committed bundle carries
          # placeholders rather than real values, and the check reads VALUES back
          # rather than grepping for placeholder text -- the comments in that file
          # name the tokens in prose, and yq does not rewrite comments.
          #
          # epoch is the field that makes this check load-bearing rather than
          # belt-and-braces. The others would surface on their own: apk will not
          # parse a version of "@PODMAN_VERSION@". But melange types epoch as an
          # integer, so its placeholder has to be `null`, and melange reads null
          # as 0 without complaint. An unsubstituted epoch therefore ships a
          # perfectly plausible package carrying the wrong revision, one that can
          # never supersede a real release. Nothing downstream would catch it.
          bundle_version="$(yq -r '.package.version' "${definition}")"
          bundle_epoch="$(yq -r '.package.epoch' "${definition}")"
          expected_version="$(jq -er '.podman.version' <<< "${COMPONENTS}")"

          if [[ "${bundle_version}" != "${expected_version}" ]]; then
            echo "::error::${definition}: version is '${bundle_version}', expected '${expected_version}'"
            exit 1
          fi
          if [[ "${bundle_epoch}" != "${PKGREL}" ]]; then
            echo "::error::${definition}: epoch is '${bundle_epoch}', expected '${PKGREL}'"
            echo "::error::a null epoch means PKGREL never reached the bundle" >&2
            exit 1
          fi
          # `yq --arg` is jq syntax; mikefarah's yq has no such flag and would
          # silently treat the expression as a no-match. Read the list out once
          # and compare in the shell -- grep -xF is an exact whole-line match, so
          # "netavark=2.0.0" cannot be satisfied by "netavark=2.0.0-rc1".
          bundle_provides="$(yq -r '.package.dependencies.provides[]' "${definition}")"
          for component in netavark aardvark-dns catatonit buildah; do
            version="$(jq -er --arg c "${component}" '.[$c].version' <<< "${COMPONENTS}")"
            if ! grep -qxF "${component}=${version}" <<< "${bundle_provides}"; then
              echo "::error::${definition}: provides is missing ${component}=${version}"
              printf '%s\n' "${bundle_provides}" >&2
              exit 1
            fi
          done

          yq '.package' "${definition}"

      # ── act only ────────────────────────────────────────────────────────────
      # Same constraint as the component builds: melange's docker runner asks the
      # daemon to bind-mount its workspace, and under act that daemon cannot see
      # paths inside the job's container. Skipped on a GitHub runner.
      - name: Point melange at a host-visible workspace (act only)
        if: ${{ env.ACT || vars.act }}
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          workspace="${GITHUB_WORKSPACE}/.melange-workspace/bundle-${ARCH}"
          rm -rf "${workspace}"
          mkdir -p "${workspace}"

          echo "MELANGE_WORKSPACE=${workspace}" >> "${GITHUB_ENV}"
          echo "::notice::act detected; melange workspace pinned to ${workspace}"

      - name: Build the bundle
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          # Deliberately UNSIGNED. Signing is the package repository's concern:
          # this repository builds and attests, and the-wondersmith/apt owns the
          # keys and signs what it serves. A key here would either be ephemeral
          # (a signature nothing can verify -- worse than none, because apk
          # reports one) or a second durable key to manage for no gain.
          #
          # The SLSA attestation on the release is the control: it binds these
          # exact bytes to this workflow's signer identity, which is what the APT
          # control plane verifies before ingesting.
          # Empty unless the act-gated step above set it.
          workspace_args=()
          if [[ -n "${MELANGE_WORKSPACE:-}" ]]; then
            workspace_args=(--workspace-dir "${MELANGE_WORKSPACE}")
          fi

          mise x -- melange build packaging/melange/podman-bundle.yaml \
            --arch "${ARCH}" \
            --runner docker \
            --source-dir ./.melange-src \
            --out-dir ./dist \
            --generate-provenance \
            --namespace "${GITHUB_REPOSITORY_OWNER}" \
            "${workspace_args[@]}"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: podman-alpine-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.apk
          if-no-files-found: error

  package-debian:
    permissions:
      contents: read
    name: .deb / ${{ matrix.deb-arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - components
      - podman-gnu
      - resolve-effective
    container:
      image: debian:trixie

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb-arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            deb-arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install packaging toolchain
        shell: bash
        run: |
          set -eu
          apt-get update -q

          # The second group is not optional. dpkg-shlibdeps resolves each
          # soname in the payload to the package that ships it, and it can only
          # do that if the library is installed on the build system. Without
          # libsubid5 the build dies with:
          #
          #   dpkg-shlibdeps: error: cannot find library libsubid.so.5 needed by
          #   debian/podman/usr/bin/podman
          #
          # Keep this list in step with the linkage allowlist in
          # .github/actions/build/podman-gnu/action.yaml: anything that build is
          # permitted to link against has to be resolvable here.
          # jq comes from mise. Everything here is either a packaging tool or a
          # runtime library dpkg-shlibdeps must resolve -- neither is mise's job.
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl debhelper dpkg-dev \
            fakeroot git tar \
            libbtrfs0 libseccomp2 libselinux1 libsubid5 libsystemd0

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git, and several go on to build
          # untrusted upstream source as root. Leaving the token in
          # .git/config gives that code something to read.
          persist-credentials: false

      # ── act only ────────────────────────────────────────────────────────────
      # jdx/mise-action is a Node action. On GitHub, the runner injects its own
      # node into `container:` jobs; act does not, so mise-action dies with
      #
      #   exec: "node": executable file not found in $PATH
      #
      # Installing the distro node is enough for act to exec the action. Skipped
      # entirely on a real runner, which supplies its own.
      - name: Install node for mise-action (act only)
        if: ${{ env.ACT || vars.act }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends nodejs
          node --version

      - name: Provision the tool set
        uses: ./.github/actions/prepare-ci-env

      - name: Collect the built components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: component-*-${{ matrix.arch }}
          merge-multiple: true
          path: components

      - name: Assemble the package
        uses: ./.github/actions/package/podman/debian
        with:
          components-dir: components
          # The EFFECTIVE set; see the bundle job. Debian's Provides carries the
          # same claim the .apk's does and must be just as true.
          components: ${{ needs.resolve-effective.outputs.components }}
          pkgrel: ${{ inputs.pkgrel }}
          arch: ${{ matrix.deb-arch }}

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: podman-debian-${{ matrix.deb-arch }}
          path: dist/*.deb
          if-no-files-found: error
