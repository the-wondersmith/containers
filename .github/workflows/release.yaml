---
name: Release

# The orchestrator. Builds, verifies, and publishes; nothing else creates a
# release.
#
# There is no `push: tags` trigger. Tags are an *output* of this workflow, not
# an input to it -- the release is what records which versions were built, and
# the upstream watcher reads that record back on its next run. That is the
# whole of the persistent state; there is no versions.yaml.
#
# A run classified as a major event publishes a PRERELEASE rather than a
# release, and does not notify the APT control plane. promote-prerelease.yaml
# moves it to stable after the soak window, provided the acceptance suite still
# passes and nothing has filed an issue against the tag.

on:
  workflow_call:
    inputs:
      components:
        required: true
        type: string
        description: JSON object mapping each component to its version and commit.
      prerelease:
        required: false
        type: boolean
        default: false
        description: >-
          Publish as a prerelease and skip the APT dispatch. Set when any
          component crosses a major version.
      reason:
        required: false
        type: string
        default: ""
        description: Human-readable summary of what triggered this release.
    secrets:
      # Declared explicitly rather than relying on the caller's `secrets:
      # inherit`. inherit hands the called workflow EVERY secret in the
      # repository when this one needs exactly one, so naming it keeps the blast
      # radius to the credential actually in use and makes the dependency
      # visible in the workflow's own interface.
      #
      # Not required: a prerelease run never dispatches to the APT control
      # plane, so it has no need of the token at all.
      APT_DISPATCH_TOKEN:
        required: false
        description: >-
          Dispatch-only token for the APT control plane. Needed only for
          non-prerelease runs, which notify it.
  workflow_dispatch:
    inputs:
      components:
        required: true
        type: string
        description: JSON object mapping each component to its version and commit.
      prerelease:
        required: false
        type: boolean
        default: false
        description: Publish as a prerelease and skip the APT dispatch.
      reason:
        required: false
        type: string
        default: manual dispatch
        description: Human-readable summary of what triggered this release.

permissions:
  actions: read
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Derive the package revision from the previous release rather than from a
  # committed field. If podman's own version moved, this is the first build of
  # a new upstream version and the revision resets; otherwise it increments, so
  # a release driven purely by a buildah bump is still distinguishable.
  # ───────────────────────────────────────────────────────────────────────────
  identity:
    name: Resolve release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      pkgrel: ${{ steps.derive.outputs.pkgrel }}
      tag: ${{ steps.derive.outputs.tag }}
      podman-version: ${{ steps.derive.outputs.podman-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Nothing here pushes with git; do not leave the token on disk.
          persist-credentials: false

      - name: Authorize the triggering actor
        uses: ./.github/actions/authorize-actor
        with:
          allow-dependabot: "false"

      - name: Provision the tool set
        uses: ./.github/actions/prepare-ci-env

      - name: Derive pkgrel and tag from the previous release
        id: derive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail

          podman_version="$(jq -er '.podman.version' <<< "${COMPONENTS}")"

          # Product classification is required here: without it, the first
          # proxmox/* release would become podman's "previous release". That
          # tag carries no podman manifest, so the download below would either
          # hard-fail every subsequent podman release, or fall through to the
          # bootstrap branch and silently reset pkgrel to 1.
          # softprops/action-gh-release then updates the existing release in
          # place rather than creating a new one, losing a build silently.

          # The previous manifest is an asset on the most recent release,
          # INCLUDING prereleases: two consecutive major bumps must not collide
          # on the same tag.
          #
          # The tag has to be resolved explicitly. `gh release download` with no
          # tag resolves GitHub's "latest" release, which by definition excludes
          # prereleases -- so with only a prerelease outstanding it reported
          # "release not found", the bootstrap branch was taken, and pkgrel reset
          # to 1. Observed for real: a second dispatch recomputed v6.0.2-1 and
          # updated the existing prerelease in place rather than publishing -2.
          #
          # `gh release list` does include prereleases, so the tag is resolved
          # from it first and then downloaded by name.
          # NOT mktemp: it creates the file, and `gh release download --output`
          # refuses to write a path that already exists --
          #
          #   <path> already exists (use `--clobber` to overwrite file ...)
          #
          # It exits 1, which the previous `2> /dev/null` hid along with the
          # message, so this looked exactly like "no previous release exists". The
          # download therefore never succeeded, the bootstrap branch always ran,
          # and pkgrel stayed pinned at 1 -- which is why v6.0.2-1 was recomputed
          # three times and the release updated in place, rather than -2 and -3
          # being published.
          #
          # Fixing the tag resolution in #11 was necessary but not sufficient:
          # this failure sat behind it. stderr is no longer discarded, so a future
          # failure here says why instead of silently bootstrapping.
          previous_manifest="${RUNNER_TEMP}/previous-manifest.json"
          previous_tag=""
          rc=0
          previous_tag="$(
            .github/scripts/release-identity.sh previous podman
          )" || rc=$?

          if [[ "${rc}" -eq 0 ]]; then
            if gh release download "${previous_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern manifest.json --output "${previous_manifest}" --clobber; then
              echo "::notice::previous release: ${previous_tag}"

              # Validate rather than trust. A zero-byte or malformed manifest would
              # otherwise read as version "" and pkgrel 0, which is indistinguishable
              # from a fresh repository and silently resets the release numbering.
              if ! jq -e '.pkgrel and .components.podman.version' \
                "${previous_manifest}" > /dev/null; then
                echo "::error::${previous_tag} has no usable manifest.json; refusing to guess pkgrel"
                exit 1
              fi

              previous_podman="$(jq -r '.components.podman.version' "${previous_manifest}")"
              previous_pkgrel="$(jq -r '.pkgrel' "${previous_manifest}")"
            else
              echo "::notice::no previous release found; bootstrapping"
              previous_podman=""
              previous_pkgrel=0
            fi
          elif [[ "${rc}" -eq 65 ]]; then
            echo "::notice::no previous release found; bootstrapping"
            previous_podman=""
            previous_pkgrel=0
          elif [[ "${rc}" -eq 66 ]]; then
            echo "::error::release list was truncated; a podman release was not found"
            echo "::error::bootstrapping would silently reset pkgrel to 1; refusing"
            exit 1
          else
            echo "::error::release-identity.sh previous podman failed (exit ${rc})"
            exit 1
          fi

          if [[ "${previous_podman}" != "${podman_version}" ]]; then
            pkgrel=1
          else
            pkgrel=$(( previous_pkgrel + 1 ))
          fi

          {
            echo "pkgrel=${pkgrel}"
            echo "tag=v${podman_version}-${pkgrel}"
            echo "podman-version=${podman_version}"
          } >> "${GITHUB_OUTPUT}"

          echo "::notice::releasing as v${podman_version}-${pkgrel}"

  build:
    name: Build
    needs: identity
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-podman-packages.yaml
    with:
      components: ${{ inputs.components }}
      pkgrel: ${{ needs.identity.outputs.pkgrel }}

  test:
    name: Acceptance
    needs:
      - identity
      - build
    permissions:
      contents: read
      # The called workflow resolves its artifacts through the API so that a
      # dispatch can point at an earlier build. That path needs `actions: read`
      # even when the run it names is the current one, and a reusable workflow
      # cannot grant itself more than its caller allows -- without this the
      # download 403s here while working fine on a manual dispatch.
      actions: read
    uses: ./.github/workflows/test-podman-packages.yaml
    with:
      components: ${{ inputs.components }}

  publish:
    name: Publish ${{ needs.identity.outputs.tag }}
    runs-on: ubuntu-latest
    needs:
      - identity
      - build
      - test
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No step here pushes with git, and several go on to build
          # untrusted upstream source as root. Leaving the token in
          # .git/config gives that code something to read.
          persist-credentials: false

      - name: Provision the tool set
        uses: ./.github/actions/prepare-ci-env

      - name: Download every built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: podman-*
          path: dist

      - name: Assert the package set is complete
        shell: bash
        run: |
          set -euo pipefail

          # The APT control plane ingests amd64 and arm64 together; publishing a
          # partial set would leave the repository inconsistent.
          declare -i missing=0
          for expected in \
            'dist/podman-debian-amd64/*.deb' \
            'dist/podman-debian-arm64/*.deb' \
            'dist/podman-alpine-x86_64/*.apk' \
            'dist/podman-alpine-aarch64/*.apk'; do
            # shellcheck disable=SC2086
            if ! compgen -G ${expected} > /dev/null; then
              echo "::error::no package matching ${expected}"
              missing=1
            else
              echo "OK: ${expected}"
            fi
          done

          [[ "${missing}" -eq 0 ]]

      - name: Give the .apk assets architecture-qualified names
        shell: bash
        run: |
          set -euo pipefail

          # melange names its output <pkg>-<version>-r<epoch>.apk with NO
          # architecture: the arch lives in the output directory, not the
          # filename. Both arches therefore produce byte-different files with
          # identical names, and GitHub keys release assets by name -- so
          # uploading both silently kept only one.
          #
          # Observed on v6.0.2-1, which shipped a single podman-6.0.2-r1.apk
          # while the build had produced two. The assertion above did not catch
          # it because it checks dist/ paths, not the resulting asset names.
          #
          # The .deb side is unaffected: dpkg already puts the arch in the name.
          for arch in x86_64 aarch64; do
            dir="dist/podman-alpine-${arch}"
            src="$(find "${dir}" -maxdepth 1 -name '*.apk' | head -n1)"

            if [[ -z "${src}" ]]; then
              echo "::error::no .apk in ${dir}"
              exit 1
            fi

            base="$(basename "${src}" .apk)"

            # Idempotent: melange may grow arch-aware naming upstream.
            if [[ "${base}" == *"-${arch}" ]]; then
              echo "already qualified: ${base}.apk"
              continue
            fi

            mv "${src}" "${dir}/${base}-${arch}.apk"
            echo "renamed ${base}.apk -> ${base}-${arch}.apk"
          done

          # Guard the class of bug rather than this one instance: every asset
          # about to be uploaded must have a unique basename, or the upload drops
          # one without failing.
          duplicates="$(
            find dist -type f \( -name '*.apk' -o -name '*.deb' \) -exec basename {} \; \
              | sort | uniq -d
          )"

          if [[ -n "${duplicates}" ]]; then
            echo "::error::asset names collide; the upload would silently drop one:"
            printf '  %s\n' "${duplicates}" >&2
            exit 1
          fi

          echo "asset names are unique"

      - name: Write the release manifest
        shell: bash
        env:
          COMPONENTS: ${{ inputs.components }}
          PKGREL: ${{ needs.identity.outputs.pkgrel }}
          TAG: ${{ needs.identity.outputs.tag }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          # This file is the repository's only persistent state. The upstream
          # watcher diffs against it to decide whether anything needs building,
          # and the identity job reads pkgrel back out of it.
          jq -n \
            --argjson components "${COMPONENTS}" \
            --arg tag "${TAG}" \
            --argjson pkgrel "${PKGREL}" \
            --arg reason "${REASON}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg revision "${GITHUB_SHA}" \
            '{
              tag: $tag,
              pkgrel: $pkgrel,
              reason: $reason,
              build_run: $run,
              build_config_revision: $revision,
              components: $components
            }' > dist/manifest.json

          cat dist/manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            dist/podman-debian-amd64/*.deb
            dist/podman-debian-arm64/*.deb
            dist/podman-alpine-x86_64/*.apk
            dist/podman-alpine-aarch64/*.apk

      - name: Publish the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          tag_name: ${{ needs.identity.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Only podman claims "latest". A second product's release workflow
          # must set make_latest: false; upstream-watch.yaml resolves GitHub's
          # "latest" release to read podman component versions.
          make_latest: true
          files: |
            dist/manifest.json
            dist/podman-debian-amd64/*.deb
            dist/podman-debian-arm64/*.deb
            dist/podman-alpine-x86_64/*.apk
            dist/podman-alpine-aarch64/*.apk

      # A release created with the default GITHUB_TOKEN does not fire the
      # `release: published` event (GitHub's anti-recursion rule), so
      # publish-apt-packages.yaml will not run for this path. Dispatch directly.
      # Skipped for prereleases: a major bump reaches the APT repository only
      # after it has survived the soak window.
      - name: Notify the APT control plane
        if: ${{ !inputs.prerelease }}
        uses: ./.github/actions/apt-dispatch
        with:
          tag: ${{ needs.identity.outputs.tag }}
          token: ${{ secrets.APT_DISPATCH_TOKEN }}
